<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Runs before any view markup is even parsed. localStorage access is
// synchronous, so this decides — before the first paint — whether to hide
// the default "home" view and show a loading state instead, avoiding a
// flash of the wrong screen while restoreAppState() does its (async) work.
(function(){
  try{
    if(localStorage.getItem('ontable-app-state')){
      document.documentElement.classList.add('restoring');
    }
  }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7A2E3D">
<meta name="description" content="Decide together where to eat, in one shared code.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OnTable">
<title>OnTable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B1620; --bg-deep:#1C0E15; --card:#F3EDE3; --card-soft:#EAE1D2;
    --ink:#2B1620; --ink-soft:#7A6459; --wine:#7A2E3D; --basil:#4B7A51;
    --citrus:#E8A93B; --tomato:#C4472E; --line: rgba(43,22,32,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    min-height:100dvh;
    font-family:'Karla', sans-serif;
  }
  .screen{
    background: var(--card); min-height:100dvh; width:100%; max-width:480px; margin:0 auto;
    display:flex; flex-direction:column; position:relative; color:var(--ink);
  }
  .update-btn{
    position:fixed; bottom:10px; right:10px; z-index:50;
    background:rgba(43,22,32,0.06); color:var(--ink-soft); border:1px solid var(--line);
    border-radius:999px; padding:5px 10px; font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; letter-spacing:.03em; cursor:pointer; display:flex; align-items:center; gap:5px;
    opacity:.55;
  }
  .update-btn:hover{opacity:1;}
  .topbar-row{display:flex; justify-content:space-between; align-items:center;}
  .lang-row{display:flex; gap:5px;}
  .lang-btn{
    padding:5px 9px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; letter-spacing:.04em; cursor:pointer;
  }
  .lang-btn.on{background:var(--wine); color:var(--card); border-color:var(--wine);}
  .topbar{padding:34px 20px 10px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
  .brand{font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--wine); display:flex; align-items:center; gap:6px;}
  .screen-title{font-family:'Cormorant Garamond', serif; font-weight:600; font-style:italic; font-size:26px; letter-spacing:-0.01em; margin:3px 0 0;}
  .screen-sub{font-size:12px; color:var(--ink-soft); margin:2px 0 0;}
  .content{flex:1; overflow-y:auto; padding:6px 20px 28px;}
  .view{display:none;}
  .view.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .section-label{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 9px;}
  .section-label:first-child{margin-top:6px;}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:14px; background:var(--card-soft);
    border:1px solid var(--line); font-family:'Karla',sans-serif; font-size:14px; color:var(--ink); outline:none;
  }
  input[type=text]::placeholder{color:rgba(122,100,89,0.6);}
  select{
    width:100%; padding:14px 40px 14px 16px; border-radius:14px; background:var(--card-soft);
    border:1px solid var(--line); font-family:'Karla',sans-serif; font-size:14px; color:var(--ink); outline:none;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237A6459' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 14px center; background-size:16px;
  }
  .btn{width:100%; padding:14px; border-radius:14px; border:none; font-family:'Karla', sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:10px;}
  .btn-primary{background:var(--wine); color:var(--card);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.4px solid var(--line);}
  .chip-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{padding:9px 14px; border-radius:999px; border:1.4px solid var(--line); background:var(--card-soft); font-size:12.5px; cursor:pointer; user-select:none;}
  .chip.on{background:var(--wine); color:var(--card); border-color:var(--wine);}
  .chip.warn.on{background:var(--tomato); border-color:var(--tomato);}
  .budget-row{display:flex; gap:8px;}
  .budget-opt{flex:1; text-align:center; padding:11px 4px; border-radius:12px; border:1.4px solid var(--line); font-size:13px; cursor:pointer; background:var(--card-soft);}
  .budget-opt.on{background:var(--citrus); border-color:var(--citrus); color:var(--ink);}
  .budget-symbol{font-family:'IBM Plex Mono', monospace; font-size:14px; margin-bottom:2px;}
  .ticket{margin-top:6px; background:var(--card-soft); border-radius:16px; padding:20px; text-align:center; border:1.5px dashed rgba(122,46,61,0.35);}
  .ticket-code{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:36px; letter-spacing:0.12em; color:var(--wine); margin:4px 0;}
  .copy-hint{font-size:10.5px; color:var(--ink-soft); margin-top:4px;}
  .who-strip{display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .who-pill{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:var(--card-soft); font-size:11.5px; border:1px solid var(--line);}
  .result-card{background:var(--card-soft); border-radius:16px; padding:14px; margin-bottom:11px; border:1px solid var(--line);}
  .result-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:8px;}
  .result-name{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px;}
  .result-type{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .score-badge{display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; flex-shrink:0; background:var(--basil); color:white; font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700;}
  .match-row{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .match-tag{font-size:10px; padding:5px 9px; border-radius:8px; background:rgba(75,122,81,0.12); color:var(--basil); font-weight:600;}
  .vote-item{background:var(--card-soft); border-radius:14px; padding:12px 14px; margin-bottom:9px; border:1px solid var(--line); cursor:pointer;}
  .vote-top{display:flex; justify-content:space-between; align-items:center;}
  .vote-name{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:16px; display:flex; align-items:center; gap:8px;}
  .vote-check{width:18px; height:18px; border-radius:6px; border:1.6px solid var(--ink-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .vote-check svg{width:11px; opacity:0;}
  .vote-item.voted .vote-check{background:var(--wine); border-color:var(--wine);}
  .vote-item.voted .vote-check svg{opacity:1;}
  .vote-count{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);}
  .vote-bar-bg{height:7px; border-radius:999px; background:rgba(43,22,32,0.08); margin-top:7px; overflow:hidden;}
  .vote-bar{height:100%; border-radius:999px; background:var(--citrus); transition:width .3s ease;}
  .vote-item.voted{border-color:var(--wine);}
  .vote-item.voted .vote-bar{background:var(--wine);}
  .note{margin-top:10px; padding:11px 13px; background:rgba(122,46,61,0.06); border:1px solid rgba(122,46,61,0.18); border-radius:12px; font-size:11px; line-height:1.5; color:#5a3340;}
  .spinner{width:16px; height:16px; border:2px solid rgba(122,46,61,0.2); border-top-color:var(--wine); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .status-line{font-size:11px; color:var(--ink-soft); margin-top:8px; text-align:center;}
  .prefstep{display:none;}
  .prefstep.active{display:block; animation:fade .2s ease;}
  .pref-dots{display:flex; justify-content:center; gap:6px; margin:18px 0 20px;}
  .pref-dots .dot{width:7px; height:7px; border-radius:50%; background:rgba(43,22,32,0.15); transition:all .15s ease;}
  .pref-dots .dot.on{background:var(--wine); width:20px; border-radius:4px;}
  .pref-nav{
    display:flex; gap:8px; margin-top:24px;
    position:sticky; bottom:0; padding:12px 0 6px;
    background:linear-gradient(to top, var(--card) 70%, rgba(243,237,227,0));
  }
  .pref-nav .btn{margin-top:0; width:auto;}
  #prefBackBtn{flex:0 0 auto; padding-left:18px; padding-right:18px;}
  #prefBackBtn.hidden{visibility:hidden;}
  #prefNextBtn{flex:1;}
  .when-banner{
    margin:0 20px 4px; padding:9px 14px; border-radius:12px;
    background:rgba(122,46,61,0.08); border:1px solid rgba(122,46,61,0.2);
    font-size:12px; color:var(--wine); font-weight:600; text-align:center;
  }
  .book-card{background:var(--card-soft); border:1.4px solid var(--basil); border-radius:14px; padding:13px 14px; margin-bottom:9px;}
  .book-card.booked{border-color:var(--basil); background:rgba(75,122,81,0.08);}
  .book-name{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:16px;}
  .book-confirm{font-size:11.5px; color:var(--basil); font-weight:600; margin-top:4px;}
  .map-modal{
    display:none; position:fixed; inset:0; background:rgba(28,14,21,0.72);
    z-index:200; align-items:center; justify-content:center; padding:18px;
  }
  .map-modal.show{display:flex;}
  .map-modal-inner{
    background:var(--card); border-radius:20px; padding:16px;
    width:100%; max-width:440px; max-height:85vh; display:flex; flex-direction:column;
  }
  .map-modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .map-modal-head span{font-family:'Cormorant Garamond', serif; font-weight:600; font-size:17px;}
  .map-modal-close{
    background:var(--card-soft); border:none; width:30px; height:30px; border-radius:50%;
    font-size:14px; color:var(--ink-soft); cursor:pointer; flex-shrink:0;
  }
  #mapFrame{width:100%; height:340px; border:0; border-radius:14px; background:var(--card-soft);}
  ::-webkit-scrollbar{display:none;}
  html.restoring .view{display:none !important;}
  #bootLoader{display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:100dvh;}
  html.restoring #bootLoader{display:flex;}
  #bootLoader .brand{font-family:'IBM Plex Mono', monospace; font-weight:500; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--wine);}
  #bootLoader .spinner{width:22px; height:22px; border:2.5px solid rgba(122,46,61,0.2); border-top-color:var(--wine); border-radius:50%; animation:spin .7s linear infinite;}
</style>
</head>
<body>

<div class="screen">
  <div id="bootLoader">
    <div class="brand">ONTABLE</div>
    <div class="spinner"></div>
  </div>
      <div class="topbar">
        <div class="topbar-row">
          <div class="brand" onclick="goHome()" style="cursor:pointer;">ONTABLE</div>
          <div class="lang-row" id="langRow"></div>
        </div>
        <div class="screen-title" id="title"></div>
        <p class="screen-sub" id="sub"></p>
      </div>
      <div id="whenBanner" class="when-banner" style="display:none;"></div>
      <div class="content">

        <!-- HOME -->
        <div class="view active" id="view-home">
          <div class="section-label" data-i18n="yourName"></div>
          <input type="text" id="myName" maxlength="20">
          <button class="btn btn-primary" id="createBtn" onclick="createSession()"></button>

          <div class="section-label" data-i18n="orJoin"></div>
          <input type="text" id="joinCode" maxlength="6" style="text-transform:uppercase">
          <button class="btn btn-ghost" id="joinBtn" onclick="joinSession()"></button>
          <div class="status-line" id="homeStatus"></div>
        </div>

        <!-- PREFS -->
        <div class="view" id="view-prefs">
          <div class="ticket">
            <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase;" data-i18n="groupCode"></div>
            <div class="ticket-code" id="codeDisplay">------</div>
            <div class="copy-hint" data-i18n="shareHint"></div>
          </div>
          <button class="btn btn-ghost" id="shareBtn" onclick="shareCode()" style="display:flex; align-items:center; justify-content:center; gap:7px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
            <span data-i18n="shareBtn"></span>
          </button>

          <div class="pref-dots" id="prefDots"></div>

          <div class="prefstep" id="step-when">
            <div class="section-label" data-i18n="whenLabel"></div>
            <div class="chip-grid" id="dateChips">
              <div class="chip" onclick="pickDatePreset(this,'today')" data-i18n="dateToday"></div>
              <div class="chip" onclick="pickDatePreset(this,'tomorrow')" data-i18n="dateTomorrow"></div>
              <div class="chip" onclick="pickDatePreset(this,'weekend')" data-i18n="dateWeekend"></div>
            </div>
            <input type="hidden" id="dateInput">
            <select id="dateSelect" onchange="onDateSelectChange(this.value)" style="margin-top:8px;"></select>

            <div class="chip-grid" style="margin-top:14px;" id="timeChips">
              <div class="chip" onclick="pickTimePreset(this,12.5)" data-i18n="timeLunch"></div>
              <div class="chip" onclick="pickTimePreset(this,18)" data-i18n="timeAperitif"></div>
              <div class="chip" onclick="pickTimePreset(this,20)" data-i18n="timeDinner"></div>
            </div>
            <input type="hidden" id="timeInput">
            <select id="timeSelect" onchange="onTimeSelectChange(this.value)" style="margin-top:8px;"></select>

            <div class="note" data-i18n="timeNote" style="margin-top:8px;"></div>
          </div>

          <div class="prefstep" id="step-type">
            <div class="section-label" data-i18n="typeLabel"></div>
            <div class="chip-grid">
              <div class="chip" data-val="restaurant" onclick="toggleChip(this)" data-i18n="restaurantChip"></div>
              <div class="chip" data-val="cafe" onclick="toggleChip(this)" data-i18n="cafeChip"></div>
              <div class="chip" data-val="bar" onclick="toggleChip(this)" data-i18n="barChip"></div>
            </div>
          </div>

          <div class="prefstep" id="step-budget">
            <div class="section-label" data-i18n="budgetLabel"></div>
            <div class="budget-row">
              <div class="budget-opt" data-val="2" onclick="budgetSelect(this)">
                <div class="budget-symbol">€</div>
                <div data-i18n="budgetLow"></div>
              </div>
              <div class="budget-opt" data-val="3" onclick="budgetSelect(this)">
                <div class="budget-symbol">€€</div>
                <div data-i18n="budgetMid"></div>
              </div>
              <div class="budget-opt" data-val="4" onclick="budgetSelect(this)">
                <div class="budget-symbol">€€€</div>
                <div data-i18n="budgetHigh"></div>
              </div>
            </div>
          </div>

          <div class="prefstep" id="step-district">
            <div class="section-label" data-i18n="districtLabel"></div>
            <div class="chip-grid">
              <div class="chip" data-val="I" onclick="toggleChip(this)">Bratislava I</div>
              <div class="chip" data-val="II" onclick="toggleChip(this)">Bratislava II</div>
              <div class="chip" data-val="III" onclick="toggleChip(this)">Bratislava III</div>
              <div class="chip" data-val="IV" onclick="toggleChip(this)">Bratislava IV</div>
              <div class="chip" data-val="V" onclick="toggleChip(this)">Bratislava V</div>
            </div>
          </div>

          <div class="prefstep" id="step-restrictions">
            <div class="section-label" data-i18n="restrictionsLabel"></div>
            <div class="chip-grid">
              <div class="chip" data-val="none" onclick="toggleNoneRestriction(this)" data-i18n="noneChip"></div>
              <div class="chip warn" data-val="vegetarien" onclick="toggleRestriction(this)" data-i18n="vegetarianChip"></div>
              <div class="chip warn" data-val="vegan" onclick="toggleRestriction(this)" data-i18n="veganChip"></div>
              <div class="chip warn" data-val="sans_gluten" onclick="toggleRestriction(this)" data-i18n="glutenChip"></div>
              <div class="chip warn" data-val="sans_lactose" onclick="toggleRestriction(this)" data-i18n="lactoseChip"></div>
            </div>
            <div class="note" data-i18n="vegNote"></div>
            <div class="note" data-i18n="glutenNote" style="margin-top:8px; border-color:rgba(122,100,89,0.3); background:rgba(122,100,89,0.06); color:var(--ink-soft);"></div>
          </div>

          <div class="pref-nav">
            <button class="btn btn-ghost" id="prefBackBtn" onclick="prefBack()" data-i18n="backBtn"></button>
            <button class="btn btn-primary" id="prefNextBtn" onclick="prefNext()"></button>
          </div>
          <div class="status-line" id="prefsStatus"></div>
        </div>

        <!-- WAITING -->
        <div class="view" id="view-waiting">
          <div class="section-label" data-i18n="participantsLabel"></div>
          <div class="who-strip" id="whoStrip"></div>
          <div class="note" data-i18n="waitingNote"></div>
          <button class="btn btn-primary" id="seeIdeasBtn" onclick="generateSuggestions()"></button>
          <div class="status-line" id="waitingStatus"></div>
        </div>

        <!-- SUGGESTIONS -->
        <div class="view" id="view-suggestions">
          <div class="section-label" data-i18n="suggestionsSub"></div>
          <div id="resultsList"></div>
          <div id="mapModal" class="map-modal" onclick="if(event.target===this) closeMapModal()">
            <div class="map-modal-inner">
              <div class="map-modal-head">
                <span id="mapModalTitle"></span>
                <button class="map-modal-close" onclick="closeMapModal()">✕</button>
              </div>
              <iframe id="mapFrame" src="" loading="lazy"></iframe>
              <a id="mapModalOpenLink" href="#" target="_blank" rel="noopener" class="btn btn-ghost" style="margin-top:10px;" data-i18n="openInMaps"></a>
            </div>
          </div>
          <button class="btn btn-primary" id="launchVoteBtn" onclick="showView('vote')"></button>
        </div>

        <!-- VOTE -->
        <div class="view" id="view-vote">
          <div class="section-label" data-i18n="voteSub"></div>
          <div class="note" data-i18n="voteHint" style="margin-top:0; margin-bottom:12px;"></div>
          <div id="voteList"></div>
          <div id="bookSection"></div>
        </div>

      </div>

  <button id="updateBtn" class="update-btn" onclick="checkForUpdate()">⟳ <span id="verLabel"></span></button>
</div>

<script src="version.js"></script>
<script>
// ---------- i18n ----------
const LANGS = {
en:{ code:"EN", homeTitle:"Where to?", homeSub:"Create a code, invite whoever you want.",
  yourName:"Your name", namePlaceholder:"e.g. Fab", createBtn:"Create a new code",
  orJoin:"Or join an existing code", joinPlaceholder:"E.G. 7F3QK", joinBtn:"Join",
  prefsTitle:"Your preferences", prefsSub:"Everyone answers on their own.",
  groupCode:"Group code", shareHint:"Share this code — everyone enters it on their phone",
  shareBtn:"Share the code", shareMessage:"Join me on OnTable — code {code}:", shareCopied:"Copied to clipboard",
  typeLabel:"Type of place", restaurantChip:"Restaurant", cafeChip:"Café", barChip:"Bar",
  budgetLabel:"Max budget", budgetLow:"Affordable", budgetMid:"Mid-range", budgetHigh:"Upscale", districtLabel:"District (Bratislava I–V)",
  restrictionsLabel:"Dietary restrictions", vegetarianChip:"Vegetarian", veganChip:"Vegan", glutenChip:"Gluten-free", lactoseChip:"Lactose-free", noneChip:"None", backBtn:"Back", nextBtn:"Next",
  vegNote:"Vegetarian/vegan is a real filter, based on Google's data — we keep any place offering at least one vegetarian dish (100% veg/vegan restaurants get a separate badge). Google doesn't distinguish vegan specifically, so \"vegan\" uses the same signal as a safe approximation.",
  glutenNote:"Gluten-free and lactose-free aren't filtered yet — Google has no reliable data for these. They're shown to the group as a heads-up; always confirm with the venue.",
  submitPrefsBtn:"Submit my preferences", waitingTitle:"Waiting", waitingSub:"Others are answering live.",
  participantsLabel:"Participants", waitingNote:"Waiting for at least one answer. You can generate ideas any time, even if not everyone has answered yet.",
  seeIdeasBtn:"See ideas", waitingStatus:"waiting for the others…",

let currentLang = 'en';
function t(k){ return LANGS[currentLang][k] || LANGS.en[k] || k; }

// ---------- Backend: Apps Script (replaces window.storage) ----------
// Paste your deployed Apps Script Web App URL here (ends with /exec).
// See Code.gs for the backend code and deployment steps.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHq_QnpPlgI0rK5ywV032zY0w3uG-oW5fzoZEXcjabfoYa3cSf_8tdImfny2f2Wu7X/exec';

async function storageGet(key){
  const url = APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key);
  const res = await fetch(url);
  const data = await res.json();
  return data.value ? { value: data.value } : null;
}

async function storageSet(key, value){
  const url = APPS_SCRIPT_URL + '?action=set&key=' + encodeURIComponent(key) + '&value=' + encodeURIComponent(value);
  const res = await fetch(url);
  const data = await res.json();
  if(!data.ok) throw new Error('storage set failed');
  return true;
}

async function storageList(prefix){
  const url = APPS_SCRIPT_URL + '?action=list&prefix=' + encodeURIComponent(prefix);
  const res = await fetch(url);
  const data = await res.json();
  return data.keys || [];
}

async function storageGetByPrefix(prefix){
  const url = APPS_SCRIPT_URL + '?action=getbyprefix&prefix=' + encodeURIComponent(prefix);
  const res = await fetch(url);
  const data = await res.json();
  return data.data || {}; // { name: rawValueString, ... } — already stripped of the prefix
}

// Each participant only ever reads/writes THEIR OWN key below — never a
// shared blob everyone rewrites. That's what avoids the lost-update race
// where two people voting/answering at the same moment could erase each
// other's entry.
function keyMeta(code){ return 'ontable-session-'+code+'-meta'; }
function keyPrefs(code, name){ return 'ontable-session-'+code+'-prefs-'+name; }
function keyVote(code, name){ return 'ontable-session-'+code+'-vote-'+name; }
function keyBooking(code){ return 'ontable-session-'+code+'-booking'; }
function prefsPrefix(code){ return 'ontable-session-'+code+'-prefs-'; }
function votePrefix(code){ return 'ontable-session-'+code+'-vote-'; }

function renderLangRow(){
  const row = document.getElementById('langRow');
  row.innerHTML = Object.keys(LANGS).map(l=>
    `<button class="lang-btn ${l===currentLang?'on':''}" onclick="setLang('${l}')">${LANGS[l].code}</button>`
  ).join('');
}
function setLang(l){
  currentLang = l;
  renderLangRow();
  applyLang();
}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.getElementById('myName').placeholder = t('namePlaceholder');
  document.getElementById('joinCode').placeholder = t('joinPlaceholder');
  document.getElementById('createBtn').textContent = t('createBtn');
  document.getElementById('joinBtn').textContent = t('joinBtn');
  document.getElementById('seeIdeasBtn').textContent = t('seeIdeasBtn');
  document.getElementById('waitingStatus').textContent = t('waitingStatus');
  document.getElementById('launchVoteBtn').textContent = t('launchVoteBtn');
  populateDateOptions();
  populateTimeOptions();
  if(currentView==='prefs' && prefSteps.length) renderPrefStep();
  updateWhenBanner();
  refreshTitles(currentView);
  if(currentView==='suggestions' && lastResults.length) renderResults();
  if(currentView==='vote') renderVoteList();
}

// ---------- Day/time: set once by the creator, shown to everyone from the
// Waiting screen onward via a persistent banner. ----------
function formatWhenText(){
  if(!sessionMeta || (!sessionMeta.dateRaw && !sessionMeta.timeRaw)) return null;
  const locale = {en:'en-GB', sk:'sk-SK', hu:'hu-HU', fr:'fr-FR'}[currentLang] || 'en-GB';
  let dateLabel = '';
  if(sessionMeta.dateRaw){
    const d = new Date(sessionMeta.dateRaw+'T00:00:00');
    dateLabel = d.toLocaleDateString(locale, {weekday:'short', day:'numeric', month:'short'});
  }
  return [dateLabel, sessionMeta.timeRaw].filter(Boolean).join(' — ');
}

function updateWhenBanner(){
  const el = document.getElementById('whenBanner');
  if(!['waiting','suggestions','vote'].includes(currentView)){ el.style.display = 'none'; return; }
  const text = formatWhenText();
  if(text){ el.textContent = '🗓 ' + text; el.style.display = ''; }
  else{ el.style.display = 'none'; }
}

// ---------- Preferences wizard: one question per screen ----------
// Creator plans the day/time first (it needs to exist before anyone else's
// answers matter) — everyone else skips straight to Type of place.
function initPrefsWizard(){
  prefSteps = state.isCreator
    ? ['when','type','budget','district','restrictions']
    : ['type','budget','district','restrictions'];
  prefStepIndex = 0;
  renderPrefStep();
}

function renderPrefStep(){
  document.querySelectorAll('.prefstep').forEach(el=>el.classList.remove('active'));
  const stepName = prefSteps[prefStepIndex];
  document.getElementById('step-'+stepName).classList.add('active');

  document.getElementById('prefDots').innerHTML = prefSteps.map((s,i)=>
    `<span class="dot ${i===prefStepIndex?'on':''}"></span>`
  ).join('');

  document.getElementById('prefBackBtn').classList.toggle('hidden', prefStepIndex===0);
  document.getElementById('prefBackBtn').textContent = t('backBtn');
  const isLast = prefStepIndex === prefSteps.length-1;
  document.getElementById('prefNextBtn').textContent = isLast ? t('submitPrefsBtn') : t('nextBtn');
  document.getElementById('prefsStatus').textContent = '';
}

function prefBack(){
  if(prefStepIndex>0){ prefStepIndex--; renderPrefStep(); }
}

function prefNext(){
  const stepName = prefSteps[prefStepIndex];

  if(stepName === 'type'){
    const chosen = document.querySelectorAll('#step-type .chip.on[data-val]');
    if(chosen.length===0){ document.getElementById('prefsStatus').textContent = t('prefsStatusNoType'); return; }
  }

  if(stepName === 'when'){
    // Day/time is session-wide, set once here — broadcast immediately so
    // the banner can show up for everyone else as soon as possible, rather
    // than waiting for the whole wizard to finish.
    const timeRaw = document.getElementById('timeInput').value;
    let time = null;
    if(timeRaw){ const [hh, mm] = timeRaw.split(':').map(Number); time = hh + mm/60; }
    const dateRaw = document.getElementById('dateInput').value;
    let dayOfWeek = null;
    if(dateRaw){ dayOfWeek = new Date(dateRaw+'T00:00:00').getDay(); }
    sessionMeta = { by: state.name, dateRaw, dayOfWeek, time, timeRaw };
    storageSet(keyMeta(state.code), JSON.stringify({ code: state.code, createdAt: Date.now(), ...sessionMeta }))
      .catch(()=> showToast(t('prefsStatusError')));
  }

  if(prefStepIndex < prefSteps.length-1){
    prefStepIndex++;
    renderPrefStep();
  }else{
    submitPrefs();
  }
}


let state = { code:null, name:null, isCreator:false };
let sessionMeta = null; // { by, dateRaw, dayOfWeek, time, timeRaw } — creator-set, shown to everyone via the banner
let currentView = 'home';
let lastResults = [];
let pollTimer = null;
let prefSteps = [];
let prefStepIndex = 0;

function refreshTitles(name){
  const titles = {
    home:['homeTitle','homeSub'], prefs:['prefsTitle','prefsSub'], waiting:['waitingTitle','waitingSub'],
    suggestions:['suggestionsTitle','suggestionsSub'], vote:['voteTitle','voteSub']
  };
  document.getElementById('title').textContent = t(titles[name][0]);
  document.getElementById('sub').textContent = t(titles[name][1]);
}

function showView(name){
  currentView = name;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  refreshTitles(name);
  stopPolling();
  if(name==='waiting'){ refreshWaiting(); startPolling(refreshWaiting); }
  if(name==='vote'){ renderVoteList(); startPolling(renderVoteList); }
  updateWhenBanner();
  saveAppState();
}

// ---------- Survive a page refresh: stay on the current screen instead of
// bouncing back to the home screen. Explicit "start over" is the ONTABLE
// title (goHome), not an accidental reload. ----------
const APP_STATE_KEY = 'ontable-app-state';

function saveAppState(){
  if(currentView === 'home'){
    localStorage.removeItem(APP_STATE_KEY);
    return;
  }
  localStorage.setItem(APP_STATE_KEY, JSON.stringify({
    code: state.code, name: state.name, isCreator: state.isCreator, view: currentView
  }));
}

function goHome(){
  stopPolling();
  localStorage.removeItem(APP_STATE_KEY);
  state = { code:null, name:null, isCreator:false };
  sessionMeta = null; lastResults = []; latestBooking = null; latestVoteData = {};
  showView('home');
  document.documentElement.classList.remove('restoring');
}

async function restoreAppState(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(APP_STATE_KEY)); }catch(e){ saved = null; }
  if(!saved || !saved.code || !saved.name){
    document.documentElement.classList.remove('restoring');
    return;
  }

  state.code = saved.code; state.name = saved.name; state.isCreator = !!saved.isCreator;
  document.getElementById('codeDisplay').textContent = saved.code;

  try{
    const res = await storageGet(keyMeta(state.code));
    if(res && res.value){ try{ sessionMeta = JSON.parse(res.value); }catch(e){} }

    if(saved.view === 'prefs'){
      initPrefsWizard();
      showView('prefs');
    }else if(saved.view === 'waiting'){
      showView('waiting');
    }else if(saved.view === 'suggestions' || saved.view === 'vote'){
      await generateSuggestions(); // re-fetches live venues fresh, shows 'suggestions'
      if(saved.view === 'vote') showView('vote');
    }
    document.documentElement.classList.remove('restoring');
  }catch(e){
    goHome(); // the saved session is no longer reachable — start clean rather than get stuck
  }
}

function randCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<5;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function pickDatePreset(el, preset){
  document.querySelectorAll('#dateChips .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const d = new Date();
  if(preset === 'tomorrow'){
    d.setDate(d.getDate()+1);
  } else if(preset === 'weekend'){
    const day = d.getDay(); // 0=Sun..6=Sat
    if(day !== 6) d.setDate(d.getDate() + ((6 - day + 7) % 7));
  }
  const iso = d.toISOString().slice(0,10);
  document.getElementById('dateInput').value = iso;
  document.getElementById('dateSelect').value = iso;
}

function pickTimePreset(el, hours){
  document.querySelectorAll('#timeChips .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const hh = Math.floor(hours);
  const mm = Math.round((hours - hh) * 60);
  const val = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  document.getElementById('timeInput').value = val;
  document.getElementById('timeSelect').value = val;
}

function populateDateOptions(){
  const sel = document.getElementById('dateSelect');
  const current = sel.value;
  const locale = {en:'en-GB', sk:'sk-SK', hu:'hu-HU', fr:'fr-FR'}[currentLang] || 'en-GB';
  let html = `<option value="">${t('selectPlaceholder')}</option>`;
  for(let i=0;i<14;i++){
    const d = new Date();
    d.setDate(d.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    const label = d.toLocaleDateString(locale, {weekday:'short', day:'numeric', month:'short'});
    html += `<option value="${iso}">${label}</option>`;
  }
  sel.innerHTML = html;
  if(current) sel.value = current;
}

function populateTimeOptions(){
  const sel = document.getElementById('timeSelect');
  const current = sel.value;
  let html = `<option value="">${t('selectPlaceholder')}</option>`;
  for(let h=7; h<=25; h++){ // covers up to 1am, for late dinners/bars
    for(const m of [0,30]){
      const hh = h % 24;
      const label = String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0');
      html += `<option value="${label}">${label}</option>`;
    }
  }
  sel.innerHTML = html;
  if(current) sel.value = current;
}

async function shareCode(){
  const code = state.code;
  const shareText = t('shareMessage').replace('{code}', code);
  const shareUrl = location.href.split('?')[0];

  // Native share sheet (lets the person pick WhatsApp or any other app they
  // have installed) — this is what most phones support best.
  if(navigator.share){
    try{
      await navigator.share({ title: 'OnTable', text: shareText, url: shareUrl });
      return;
    }catch(e){ return; } // person cancelled the share sheet — do nothing further
  }

  // Fallback for browsers without navigator.share: open WhatsApp directly.
  const waUrl = 'https://wa.me/?text=' + encodeURIComponent(shareText + ' ' + shareUrl);
  const opened = window.open(waUrl, '_blank');
  if(opened) return;

  // Last resort: copy to clipboard.
  try{
    await navigator.clipboard.writeText(shareText + ' ' + shareUrl);
    showToast(t('shareCopied'));
  }catch(e){ showToast(shareText + ' ' + shareUrl); }
}
function startPolling(fn){ pollTimer = setInterval(fn, 3000); }

// Small non-blocking banner for background write failures — used only when
// we've already moved the user to the next screen optimistically and the
// actual save fails afterward (rare), so they still get told about it.
function showToast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--tomato);color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;font-family:Karla,sans-serif;z-index:100;box-shadow:0 6px 16px rgba(0,0,0,0.25);max-width:85%;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '0'; }, 4000);
}

function createSession(){
  const name = document.getElementById('myName').value.trim();
  if(!name){ document.getElementById('homeStatus').textContent=t('homeStatusNoName'); return; }
  const code = randCode();
  // Optimistic: the code is generated locally, so there's nothing to wait
  // for before showing the next screen — the write to the backend happens
  // in the background.
  state.code = code; state.name = name; state.isCreator = true;
  document.getElementById('codeDisplay').textContent = code;
  initPrefsWizard();
  showView('prefs');
  storageSet(keyMeta(code), JSON.stringify({ code, createdAt: Date.now(), by: name, dateRaw:null, dayOfWeek:null, time:null, timeRaw:null }))
    .catch(()=> showToast(t('homeStatusError')));
}

async function joinSession(){
  const name = document.getElementById('myName').value.trim();
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name || !code){ document.getElementById('homeStatus').textContent=t('homeStatusNoCode'); return; }
  const btn = document.getElementById('joinBtn');
  const original = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try{
    const res = await storageGet(keyMeta(code));
    if(!res){ document.getElementById('homeStatus').textContent=t('homeStatusNotFound'); return; }
    state.code = code; state.name = name; state.isCreator = false;
    try{ sessionMeta = JSON.parse(res.value); }catch(e){ sessionMeta = null; }
    document.getElementById('codeDisplay').textContent = code;
    initPrefsWizard();
    showView('prefs');
  }catch(e){ document.getElementById('homeStatus').textContent=t('homeStatusNotFound'); }
  finally{ btn.textContent = original; btn.disabled = false; }
}

function scoreVenue(v, participants, sessionTime){
  const needsVeg = Object.values(participants).some(p=>p.restrictions.includes('vegetarien') || p.restrictions.includes('vegan'));
  if(needsVeg && !v.veg) return null;
  // Note: gluten-free / lactose-free are recorded in each participant's prefs
  // but not filtered here — Google Places has no reliable field for either,
  // so a "hard filter" would just be guessing. Shown as informational only.
  const maxBudget = Math.min(...Object.values(participants).map(p=>p.budget));
  if(v.p > maxBudget) return null;
  for(const p of Object.values(participants)){
    if(p.districts && p.districts.length>0 && !p.districts.includes(v.district)) return null;
  }
  if(sessionTime !== null && sessionTime !== undefined){
    if(sessionTime < v.open || sessionTime > v.close) return null;
  }
  const total = Object.keys(participants).length;
  let matchCount = 0; const likedBy = [];
  Object.entries(participants).forEach(([name,p])=>{
    if(p.types.some(ty=>v.t.includes(ty))){ matchCount++; likedBy.push(name); }
  });
  const score = Math.round((matchCount/total)*100);
  return { v, score, likedBy };
}

// ---------- Live venues via Google Places API (New), proxied through Apps Script ----------
async function fetchPlacesForQuery(query){
  const url = APPS_SCRIPT_URL + '?action=places&query=' + encodeURIComponent(query);
  const res = await fetch(url);
  const data = await res.json();
  return data.places || [];
}

function priceLevelToNum(pl){
  switch(pl){
    case 'PRICE_LEVEL_INEXPENSIVE': return 2;
    case 'PRICE_LEVEL_MODERATE': return 3;
    case 'PRICE_LEVEL_EXPENSIVE': return 4;
    case 'PRICE_LEVEL_VERY_EXPENSIVE': return 4;
    default: return 3; // unknown -> moderate, rather than wrongly excluding it on budget
  }
}

function typesFromGoogle(types){
  const out = [];
  if((types||[]).some(x=>['restaurant','meal_takeaway','meal_delivery'].includes(x))) out.push('restaurant');
  if((types||[]).some(x=>['cafe','bakery'].includes(x))) out.push('cafe');
  if((types||[]).some(x=>['bar','night_club','wine_bar'].includes(x))) out.push('bar');
  if(out.length===0) out.push('restaurant');
  return out;
}

function hoursFromGoogle(place, dayOfWeek){
  const periods = place.regularOpeningHours && place.regularOpeningHours.periods;
  if(!periods || periods.length===0) return { open: 0, close: 24 }; // unknown -> don't filter it out
  let p = periods[0];
  if(dayOfWeek !== null && dayOfWeek !== undefined){
    const match = periods.find(per => per.open && per.open.day === dayOfWeek);
    if(match) p = match; // else silently falls back to the first period
  }
  const open = p.open ? (p.open.hour + (p.open.minute||0)/60) : 0;
  let close = p.close ? (p.close.hour + (p.close.minute||0)/60) : 24;
  if(close < open) close = 24; // rough fallback for overnight venues
  return { open, close };
}

const DISTRICT_QUERIES = {
  I:   'restaurants cafes bars in Staré Mesto, Bratislava I, Slovakia',
  II:  'restaurants cafes bars in Ružinov, Bratislava II, Slovakia',
  III: 'restaurants cafes bars in Nové Mesto, Bratislava III, Slovakia',
  IV:  'restaurants cafes bars in Karlova Ves, Bratislava IV, Slovakia',
  V:   'restaurants cafes bars in Petržalka, Bratislava V, Slovakia'
};

async function fetchLiveVenues(districts, dayOfWeek){
  const targets = districts.length ? districts : ['I','II','III','IV','V'];
  const batches = await Promise.all(targets.map(d =>
    fetchPlacesForQuery(DISTRICT_QUERIES[d]).then(places => ({d, places})).catch(()=>({d, places:[]}))
  ));
  const venues = [];
  const seen = new Set();
  batches.forEach(({d, places}) => {
    places.forEach(p => {
      const name = p.displayName ? p.displayName.text : null;
      if(!name || seen.has(name)) return;
      seen.add(name);
      const hrs = hoursFromGoogle(p, dayOfWeek);
      venues.push({
        n: name,
        t: typesFromGoogle(p.types),
        p: priceLevelToNum(p.priceLevel),
        r: p.rating || 4.0,
        veg: p.servesVegetarianFood !== false, // unknown -> assume possible rather than excluding
        vegOnly: false,
        district: d,
        area: p.formattedAddress || '',
        open: hrs.open,
        close: hrs.close,
        phone: p.nationalPhoneNumber || null,
        mapsUri: p.googleMapsUri || null
      });
    });
  });
  return venues;
}

async function generateSuggestions(){
  const btn = document.getElementById('seeIdeasBtn');
  const original = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try{
    const participants = await fetchAllParticipants();
    if(Object.keys(participants).length===0){
      document.getElementById('waitingStatus').textContent = t('waitingStatusNoAnswer');
      return;
    }
    const districtUnion = [...new Set(Object.values(participants).flatMap(p=>p.districts||[]))];

    // Day/time is set once by the creator, session-wide — not per participant.
    let referenceDayOfWeek = null, sessionTime = null;
    try{
      const metaRes = await storageGet(keyMeta(state.code));
      if(metaRes && metaRes.value){
        const meta = JSON.parse(metaRes.value);
        referenceDayOfWeek = meta.dayOfWeek ?? null;
        sessionTime = meta.time ?? null;
      }
    }catch(e){}

    const pool = await fetchLiveVenues(districtUnion, referenceDayOfWeek);
    if(pool.length === 0){
      document.getElementById('waitingStatus').textContent = t('waitingStatusNoPlaces');
      return;
    }

    const scored = pool.map(v=>scoreVenue(v, participants, sessionTime)).filter(Boolean);
    scored.sort((a,b)=> b.score - a.score || b.v.r - a.v.r);
    lastResults = scored.slice(0,3);
    latestBooking = null;
    renderResults();
    showView('suggestions');
  }catch(e){ document.getElementById('waitingStatus').textContent = t('waitingStatusError'); }
  finally{ btn.textContent = original; btn.disabled = false; }
}

// ---------- Voting: optimistic local state, reconciled by the background poll ----------
// latestVoteData holds the last known { name: [venueName, ...] } for everyone,
// either from the server (via renderVoteList) or from our own just-clicked
// vote. Rendering reads only from this local object — never blocks on a
// network round-trip — so a click feels instant. The write to the backend
// still happens, just in the background; the next poll (a few seconds later)
// reconciles with the server's true state if anything drifted.
let latestVoteData = {};

function castVote(venueName){
  let arr = (latestVoteData[state.name] || []).slice();
  const idx = arr.indexOf(venueName);
  if(idx>=0){ arr.splice(idx,1); }
  else { if(arr.length>=2) return; arr.push(venueName); }
  latestVoteData[state.name] = arr;
  paintVoteList(); // instant, from local state
  storageSet(keyVote(state.code, state.name), JSON.stringify(arr)).catch(()=>{});
}

function paintVoteList(){
  const counts = {}; lastResults.forEach(r=>counts[r.v.n]=0);
  let totalBallots = 0;
  for(const name in latestVoteData){
    const arr = latestVoteData[name] || [];
    arr.forEach(v=>{ if(counts[v]!==undefined) counts[v]++; });
    totalBallots += arr.length;
  }
  const totalForBars = totalBallots || 1;
  const myVotes = latestVoteData[state.name] || [];

  document.getElementById('voteList').innerHTML = lastResults.map(r=>{
    const c = counts[r.v.n];
    const pct = Math.round((c/totalForBars)*100);
    const mine = myVotes.includes(r.v.n);
    return `
      <div class="vote-item ${mine?'voted':''}" onclick="castVote('${r.v.n.replace(/'/g,"\\'")}')">
        <div class="vote-top">
          <div class="vote-name"><span class="vote-check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round"/></svg></span>${r.v.n}</div>
          <div class="vote-count">${c} ${t('votesWord')}</div>
        </div>
        <div class="vote-bar-bg"><div class="vote-bar" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');

  renderBookSection(counts);
}

let voteListBusy = false;
async function renderVoteList(){
  if(voteListBusy) return; // skip this poll tick if the previous one is still in flight
  voteListBusy = true;
  try{
    const [raw, bookingRes] = await Promise.all([
      storageGetByPrefix(votePrefix(state.code)),
      storageGet(keyBooking(state.code))
    ]);
    const parsed = {};
    for(const name in raw){
      try{ parsed[name] = JSON.parse(raw[name]); }catch(e){}
    }
    latestVoteData = parsed; // reconcile local state with the server's truth
    try{ latestBooking = bookingRes && bookingRes.value ? JSON.parse(bookingRes.value) : null; }catch(e){ latestBooking = null; }
    paintVoteList();
  }catch(e){
  }finally{
    voteListBusy = false;
  }
}

// ---------- Reservation by phone call — shared across the whole group ----------
// latestBooking lives under one key per session (not per person), so
// everyone polling the vote screen sees the same status live:
//   'calling'   — someone is on the phone with the venue right now
//   'confirmed' — they got the reservation
//   'failed'    — the call didn't result in a booking; the leading venues
//                 reappear so the group can retry (same venue or another)
let latestBooking = null;

function renderBookSection(counts){
  const section = document.getElementById('bookSection');
  let noteHtml = '';

  if(latestBooking && latestBooking.status === 'calling'){
    const mine = latestBooking.by === state.name;
    section.innerHTML = `<div class="section-label">${t('leadingLabel')}</div>
      <div class="book-card">
        <div class="book-name">${latestBooking.venue}</div>
        <div class="book-confirm">${latestBooking.by} ${t('bookCallingBy')}…</div>
        ${mine ? renderCallActions(latestBooking) : ''}
      </div>`;
    return; // block other reserve buttons while a call is in progress
  }

  if(latestBooking && latestBooking.status === 'confirmed'){
    section.innerHTML = `<div class="section-label">${t('leadingLabel')}</div>
      <div class="book-card booked">
        <div class="book-name">${latestBooking.venue}</div>
        <div class="book-confirm">${latestBooking.by} ${t('bookConfirmedBy')}</div>
      </div>`;
    return;
  }

  if(latestBooking && latestBooking.status === 'failed'){
    noteHtml = `<div class="note" style="border-color:var(--tomato); background:rgba(196,71,46,0.08); color:#7a2e1c;">${latestBooking.by} ${t('bookFailedBy')} ${latestBooking.venue}. ${t('bookRetryHint')}</div>`;
  }

  const maxCount = Math.max(0, ...Object.values(counts));
  if(maxCount === 0){ section.innerHTML = noteHtml; return; }
  const winners = lastResults.filter(r => counts[r.v.n] === maxCount);

  section.innerHTML = `<div class="section-label">${t('leadingLabel')}</div>` + noteHtml + winners.map(r => `
    <div class="book-card">
      <div class="book-name">${r.v.n}</div>
      <button class="btn btn-primary" style="margin-top:8px;" onclick="startReservation('${r.v.n.replace(/'/g,"\\'")}', '${(r.v.phone||'').replace(/'/g,"\\'")}')">${t('bookBtn')}</button>
    </div>`
  ).join('');
}

function renderCallActions(booking){
  const callBlock = booking.phone
    ? `<a class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:8px;" href="tel:${booking.phone}">${t('bookCallBtn')} ${booking.phone}</a>`
    : `<div class="note" style="margin-top:8px;">${t('bookNoPhone')}</div>`;
  return `
    ${callBlock}
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn btn-primary" style="background:var(--basil);" onclick="resolveReservation(true)">${t('bookYes')}</button>
      <button class="btn btn-ghost" onclick="resolveReservation(false)">${t('bookNo')}</button>
    </div>`;
}

function startReservation(name, phone){
  // Broadcast immediately: everyone else sees "X is calling Y…" on their
  // next poll, and their own reserve buttons disappear until this resolves.
  latestBooking = { venue: name, by: state.name, status: 'calling', phone: phone || null, at: Date.now() };
  renderBookSection({});
  storageSet(keyBooking(state.code), JSON.stringify(latestBooking)).catch(()=>{});
}

function resolveReservation(success){
  latestBooking = {
    venue: latestBooking.venue,
    by: state.name,
    status: success ? 'confirmed' : 'failed',
    phone: latestBooking.phone,
    at: Date.now()
  };
  renderBookSection({});
  storageSet(keyBooking(state.code), JSON.stringify(latestBooking)).catch(()=>{});
}

async function checkForUpdate(){
  const btn = document.getElementById('updateBtn');
  const original = btn.innerHTML;
  btn.innerHTML = '⟳ …';
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.update();
        // Force the new service worker (with the bumped CACHE_NAME) to take over,
        // then hard-reload so the freshly cached files are actually used.
        if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
      }
    }
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}
  location.reload(true);
}
</script>

</body>
