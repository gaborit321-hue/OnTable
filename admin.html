<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnTable — Réservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B1620; --card:#F3EDE3; --card-soft:#EAE1D2; --ink:#2B1620; --ink-soft:#7A6459;
    --wine:#7A2E3D; --basil:#4B7A51; --line: rgba(43,22,32,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:'Karla',sans-serif; color:var(--ink); min-height:100vh;}
  .wrap{max-width:900px; margin:0 auto; padding:32px 20px 60px;}
  .brand{font-family:'IBM Plex Mono',monospace; color:#EAD9DE; letter-spacing:.14em; font-size:12px; text-transform:uppercase; margin-bottom:6px;}
  h1{font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--card); font-size:30px; margin:0 0 24px;}

  .gate{background:var(--card); border-radius:20px; padding:28px 24px; max-width:380px; margin:60px auto;}
  .gate input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); font-size:14px; margin-top:10px; font-family:'Karla',sans-serif;}
  .gate button{width:100%; margin-top:14px; padding:13px; border-radius:12px; border:none; background:var(--wine); color:var(--card); font-weight:700; cursor:pointer;}
  .gate .err{color:#C4472E; font-size:12px; margin-top:8px; text-align:center;}

  .summary{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--card); border-radius:16px; padding:16px 20px; flex:1; min-width:140px;}
  .stat .num{font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--wine);}
  .stat .lbl{font-size:11px; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.05em;}

  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:16px; overflow:hidden;}
  th{background:var(--card-soft); text-align:left; padding:11px 14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  td{padding:11px 14px; border-top:1px solid var(--line); font-size:13.5px;}
  tr:hover td{background:rgba(122,46,61,0.04);}
  .venue{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px;}
  .amount{font-family:'IBM Plex Mono',monospace; color:var(--basil); font-weight:600;}
  .empty{color:rgba(243,237,227,0.6); text-align:center; padding:40px 0;}
  .links-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;}
  .link-chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    background:rgba(243,237,227,0.1); border:1px solid rgba(243,237,227,0.25);
    color:var(--card); text-decoration:none; font-size:12.5px; font-family:'Karla',sans-serif;
  }
  .link-chip:hover{background:rgba(243,237,227,0.18);}
  .refresh{background:transparent; border:1px solid rgba(243,237,227,0.3); color:var(--card); padding:8px 16px; border-radius:999px; font-size:12px; cursor:pointer; margin-bottom:16px;}
  tr.billed td{opacity:.5;}
  tr.billed .venue{text-decoration:line-through;}
  .del-btn{background:none; border:1px solid rgba(196,71,46,0.4); color:#C4472E; border-radius:8px; padding:5px 10px; font-size:11px; cursor:pointer;}
  .del-btn:hover{background:rgba(196,71,46,0.08);}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">ONTABLE — ADMIN</div>
  <h1>Réservations confirmées</h1>

  <div id="gate" class="gate">
    <div style="font-size:13px; color:var(--ink-soft);">Mot de passe admin</div>
    <input type="password" id="adminKeyInput" placeholder="•••••••••">
    <button onclick="loadBookings()">Voir les réservations</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="links-row">
      <a class="link-chip" href="https://console.cloud.google.com/google/maps-apis/quotas?project=ontable-506512&api=places.googleapis.com" target="_blank" rel="noopener">📍 Google Places — Quotas</a>
      <a class="link-chip" href="https://dash.cloudflare.com/fc0d3ebc1680e0674c62a0807860b1ad/workers/services/view/ontable-api/production" target="_blank" rel="noopener">⚡ Cloudflare Worker</a>
      <a class="link-chip" href="https://console.upstash.com/redis/eefcac47-c06c-4fad-af37-8b0d686c7339/details?teamid=0" target="_blank" rel="noopener">🗄️ Upstash Redis</a>
      <a class="link-chip" href="https://github.com/gaborit321-hue/OnTable/tree/main" target="_blank" rel="noopener">💻 GitHub — OnTable</a>
    </div>
    <button class="refresh" onclick="loadBookings()">↻ Actualiser</button>
    <div class="summary">
      <div class="stat"><div class="num" id="statCount">0</div><div class="lbl">Réservations</div></div>
      <div class="stat"><div class="num" id="statPeople">0</div><div class="lbl">Personnes au total</div></div>
      <div class="stat"><div class="num" id="statAmount">0 €</div><div class="lbl">Restant à facturer (2€/pers.)</div></div>
    </div>
    <div id="tableWrap"></div>
  </div>
</div>

<script>
const WORKER_URL = 'https://ontable-api.gaborit321.workers.dev';
const PRICE_PER_PERSON = 2;
let currentKey = '';
let entriesById = {}; // id -> parsed entry, kept in memory for quick toggle/delete

async function loadBookings(){
  const key = document.getElementById('adminKeyInput').value.trim();
  if(!key){ document.getElementById('gateErr').textContent = 'Entre le mot de passe.'; return; }
  currentKey = key;
  sessionStorage.setItem('ontable-admin-key', key);

  try{
    const res = await fetch(WORKER_URL + '?action=get_bookings_log&adminKey=' + encodeURIComponent(key));
    const data = await res.json();
    if(data.error){
      document.getElementById('gateErr').textContent = 'Mot de passe incorrect.';
      return;
    }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render(data.entries || {});
  }catch(e){
    document.getElementById('gateErr').textContent = 'Erreur de connexion, réessaie.';
  }
}

function render(rawEntries){
  entriesById = {};
  for(const id in rawEntries){
    try{ entriesById[id] = JSON.parse(rawEntries[id]); }catch(e){}
  }
  const ids = Object.keys(entriesById).sort((a,b) => (entriesById[b].confirmedAt||0) - (entriesById[a].confirmedAt||0));

  const totalPeopleAll = ids.reduce((sum,id) => sum + (entriesById[id].partySize||0), 0);
  const totalPeopleUnbilled = ids.filter(id => !entriesById[id].billed).reduce((sum,id) => sum + (entriesById[id].partySize||0), 0);
  document.getElementById('statCount').textContent = ids.length;
  document.getElementById('statPeople').textContent = totalPeopleAll;
  document.getElementById('statAmount').textContent = (totalPeopleUnbilled * PRICE_PER_PERSON) + ' €';

  const wrap = document.getElementById('tableWrap');
  if(ids.length === 0){
    wrap.innerHTML = '<div class="empty">Aucune réservation confirmée pour le moment.</div>';
    return;
  }

  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>Facturé</th><th>Restaurant</th><th>Personnes</th><th>Montant</th><th>Jour prévu</th><th>Heure</th><th>Confirmé le</th><th>Par</th><th>Code</th><th></th>
      </tr></thead>
      <tbody>
        ${ids.map(id => {
          const e = entriesById[id];
          return `
          <tr class="${e.billed ? 'billed' : ''}" id="row-${id}">
            <td><input type="checkbox" ${e.billed ? 'checked' : ''} onchange="toggleBilled('${id}', this.checked)"></td>
            <td class="venue">${escapeHtml(e.venue||'—')}</td>
            <td>${e.partySize ?? '—'}</td>
            <td class="amount">${(e.partySize||0) * PRICE_PER_PERSON} €</td>
            <td>${e.dateRaw||'—'}</td>
            <td>${e.timeRaw||'—'}</td>
            <td>${e.confirmedAt ? new Date(e.confirmedAt).toLocaleString('fr-FR') : '—'}</td>
            <td>${escapeHtml(e.confirmedBy||'—')}</td>
            <td style="font-family:'IBM Plex Mono',monospace; font-size:11px;">${escapeHtml(e.code||'—')}</td>
            <td><button class="del-btn" onclick="deleteBooking('${id}')">Supprimer</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

async function toggleBilled(id, checked){
  const entry = entriesById[id];
  if(!entry) return;
  entry.billed = checked;
  const url = WORKER_URL + '?action=update_booking&adminKey=' + encodeURIComponent(currentKey)
    + '&id=' + encodeURIComponent(id) + '&entry=' + encodeURIComponent(JSON.stringify(entry));
  await fetch(url).catch(()=>{});
  render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
}

async function deleteBooking(id){
  if(!confirm('Supprimer cette réservation ? Cette action est définitive.')) return;
  const url = WORKER_URL + '?action=delete_booking&adminKey=' + encodeURIComponent(currentKey) + '&id=' + encodeURIComponent(id);
  await fetch(url).catch(()=>{});
  delete entriesById[id];
  render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Convenience: if a key was already entered this browser session, skip the gate.
const savedKey = sessionStorage.getItem('ontable-admin-key');
if(savedKey){
  document.getElementById('adminKeyInput').value = savedKey;
  loadBookings();
}
</script>

</body>
</html>
