<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeMeEat — Réservations</title>
<link rel="icon" href="icons2/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons2/favicon-16.png" sizes="16x16" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2B1620; --card:#F3EDE3; --card-soft:#EAE1D2; --ink:#2B1620; --ink-soft:#7A6459;
    --wine:#7A2E3D; --basil:#4B7A51; --line: rgba(43,22,32,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:'Karla',sans-serif; color:var(--ink); min-height:100vh;}
  .wrap{max-width:900px; margin:0 auto; padding:32px 20px 60px;}
  .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
  .brand{font-family:'IBM Plex Mono',monospace; color:#EAD9DE; letter-spacing:.14em; font-size:12px; text-transform:uppercase; margin-bottom:6px;}
  .lang-row{display:flex; gap:5px;}
  .lang-btn{padding:5px 9px; border-radius:999px; border:1px solid rgba(243,237,227,0.25); background:transparent; color:rgba(243,237,227,0.7); font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.04em; cursor:pointer;}
  .lang-btn.on{background:var(--card); color:var(--wine); border-color:var(--card);}
  h1{font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--card); font-size:30px; margin:0 0 24px;}

  .gate{background:var(--card); border-radius:20px; padding:28px 24px; max-width:380px; margin:60px auto;}
  .gate input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); font-size:14px; margin-top:10px; font-family:'Karla',sans-serif;}
  .gate button{width:100%; margin-top:14px; padding:13px; border-radius:12px; border:none; background:var(--wine); color:var(--card); font-weight:700; cursor:pointer;}
  .gate .err{color:#C4472E; font-size:12px; margin-top:8px; text-align:center;}

  .summary{display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--card); border-radius:16px; padding:16px 20px; flex:1; min-width:140px;}
  .stat .num{font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--wine);}
  .stat .lbl{font-size:11px; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.05em;}

  .table-scroll{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:16px;}
  table{width:100%; min-width:760px; border-collapse:collapse; background:var(--card); border-radius:16px; overflow:hidden;}
  @media (max-width: 640px){
    .wrap{padding:20px 12px 40px;}
    .gate{padding:20px 16px; margin:30px auto;}
    h1{font-size:24px;}
    .stat{min-width:100%;}
    td, th{padding:9px 10px; font-size:12.5px;}
  }
  th{background:var(--card-soft); text-align:left; padding:11px 14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  td{padding:11px 14px; border-top:1px solid var(--line); font-size:13.5px;}
  tr:hover td{background:rgba(122,46,61,0.04);}
  .venue{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px;}
  .amount{font-family:'IBM Plex Mono',monospace; color:var(--basil); font-weight:600;}
  .empty{color:rgba(243,237,227,0.6); text-align:center; padding:40px 0;}
  .links-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px;}
  .link-chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    background:rgba(243,237,227,0.1); border:1px solid rgba(243,237,227,0.25);
    color:var(--card); text-decoration:none; font-size:12.5px; font-family:'Karla',sans-serif;
  }
  .link-chip:hover{background:rgba(243,237,227,0.18);}
  .refresh{background:transparent; border:1px solid rgba(243,237,227,0.3); color:var(--card); padding:8px 16px; border-radius:999px; font-size:12px; cursor:pointer; margin-bottom:16px;}
  tr.billed td{opacity:.5;}
  tr.billed .venue{text-decoration:line-through;}
  .del-btn{background:none; border:1px solid rgba(196,71,46,0.4); color:#C4472E; border-radius:8px; padding:5px 10px; font-size:11px; cursor:pointer;}
  .del-btn:hover{background:rgba(196,71,46,0.08);}
  #searchInput{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line); font-size:13.5px; font-family:'Karla',sans-serif;}
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <div class="brand">WEMEEAT — ADMIN</div>
    <div class="lang-row" id="langRow"></div>
  </div>
  <h1 id="pageTitle"></h1>

  <div id="gate" class="gate">
    <div style="font-size:13px; color:var(--ink-soft);" id="gateLabel"></div>
    <input type="password" id="adminKeyInput" placeholder="•••••••••">
    <button onclick="loadBookings()" id="loginBtn"></button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="links-row">
      <a class="link-chip" href="https://console.cloud.google.com/google/maps-apis/quotas?project=wemeeat-506512&api=places.googleapis.com" target="_blank" rel="noopener">📍 Google Places — Quotas</a>
      <a class="link-chip" href="https://dash.cloudflare.com/fc0d3ebc1680e0674c62a0807860b1ad/workers/services/view/wemeeat-api/production" target="_blank" rel="noopener">⚡ Cloudflare Worker</a>
      <a class="link-chip" href="https://console.upstash.com/redis/eefcac47-c06c-4fad-af37-8b0d686c7339/details?teamid=0" target="_blank" rel="noopener">🗄️ Upstash Redis</a>
      <a class="link-chip" href="https://github.com/gaborit321-hue/WeMeEat/tree/main" target="_blank" rel="noopener">💻 GitHub — WeMeEat</a>
    </div>
    <button class="refresh" onclick="loadBookings()" id="refreshBtn"></button>
    <div class="summary">
      <div class="stat"><div class="num" id="statCount">0</div><div class="lbl" id="statReservationsLbl"></div></div>
      <div class="stat"><div class="num" id="statPeople">0</div><div class="lbl" id="statPeopleLbl"></div></div>
      <div class="stat"><div class="num" id="statAmount">0 €</div><div class="lbl" id="statAmountLbl"></div></div>
    </div>
    <input type="text" id="searchInput" oninput="renderFiltered()" style="margin-bottom:14px;">
    <div id="tableWrap"></div>
  </div>
</div>

<script>
const WORKER_URL = 'https://wemeeat-api.gaborit321.workers.dev';
const PRICE_PER_PERSON = 2;
let currentKey = '';
let entriesById = {};

const LANGS = {
en:{ code:"EN", locale:"en-GB", pageTitle:"Confirmed reservations", gateLabel:"Admin password", loginBtn:"View reservations",
  errEmpty:"Enter the password.", errWrong:"Incorrect password.", errConn:"Connection error, try again.",
  refresh:"↻ Refresh", statReservations:"Reservations", statPeople:"Total people", statAmount:"Remaining to bill (€2/person)",
  thBilled:"Billed", thRestaurant:"Restaurant", thPeople:"People", thAmount:"Amount", thDay:"Planned day", thTime:"Time",
  thConfirmed:"Confirmed on", thBy:"By", thCode:"Code", deleteBtn:"Delete",
  confirmDelete:"Delete this reservation? This action is permanent.", empty:"No confirmed reservations yet.",
  searchPlaceholder:"Search by name or code…", noSearchResults:"No reservation matches your search.", cancelledHint:"{n} cancelled" },
sk:{ code:"SK", locale:"sk-SK", pageTitle:"Potvrdené rezervácie", gateLabel:"Admin heslo", loginBtn:"Zobraziť rezervácie",
  errEmpty:"Zadaj heslo.", errWrong:"Nesprávne heslo.", errConn:"Chyba pripojenia, skús znova.",
  refresh:"↻ Obnoviť", statReservations:"Rezervácie", statPeople:"Ľudí spolu", statAmount:"Zostáva vyfakturovať (2€/osoba)",
  thBilled:"Vyfakturované", thRestaurant:"Reštaurácia", thPeople:"Osoby", thAmount:"Suma", thDay:"Plánovaný deň", thTime:"Čas",
  thConfirmed:"Potvrdené dňa", thBy:"Kým", thCode:"Kód", deleteBtn:"Vymazať",
  confirmDelete:"Vymazať túto rezerváciu? Táto akcia je nezvratná.", empty:"Zatiaľ žiadne potvrdené rezervácie.",
  searchPlaceholder:"Hľadať podľa mena alebo kódu…", noSearchResults:"Žiadna rezervácia nezodpovedá hľadaniu.", cancelledHint:"{n} zrušených" },
hu:{ code:"HU", locale:"hu-HU", pageTitle:"Megerősített foglalások", gateLabel:"Admin jelszó", loginBtn:"Foglalások megtekintése",
  errEmpty:"Add meg a jelszót.", errWrong:"Hibás jelszó.", errConn:"Kapcsolódási hiba, próbáld újra.",
  refresh:"↻ Frissítés", statReservations:"Foglalások", statPeople:"Összes létszám", statAmount:"Kiszámlázandó (2€/fő)",
  thBilled:"Számlázva", thRestaurant:"Étterem", thPeople:"Létszám", thAmount:"Összeg", thDay:"Tervezett nap", thTime:"Időpont",
  thConfirmed:"Megerősítve", thBy:"Ki", thCode:"Kód", deleteBtn:"Törlés",
  confirmDelete:"Törlöd ezt a foglalást? Ez a művelet végleges.", empty:"Még nincs megerősített foglalás.",
  searchPlaceholder:"Keresés név vagy kód alapján…", noSearchResults:"Nincs a keresésnek megfelelő foglalás.", cancelledHint:"{n} lemondva" },
fr:{ code:"FR", locale:"fr-FR", pageTitle:"Réservations confirmées", gateLabel:"Mot de passe admin", loginBtn:"Voir les réservations",
  errEmpty:"Entre le mot de passe.", errWrong:"Mot de passe incorrect.", errConn:"Erreur de connexion, réessaie.",
  refresh:"↻ Actualiser", statReservations:"Réservations", statPeople:"Personnes au total", statAmount:"Restant à facturer (2€/pers.)",
  thBilled:"Facturé", thRestaurant:"Restaurant", thPeople:"Personnes", thAmount:"Montant", thDay:"Jour prévu", thTime:"Heure",
  thConfirmed:"Confirmé le", thBy:"Par", thCode:"Code", deleteBtn:"Supprimer",
  confirmDelete:"Supprimer cette réservation ? Cette action est définitive.", empty:"Aucune réservation confirmée pour le moment.",
  searchPlaceholder:"Rechercher par nom ou code…", noSearchResults:"Aucune réservation ne correspond à ta recherche.", cancelledHint:"{n} annulé(s)" }
};
let currentLang = localStorage.getItem('wemeeat-admin-lang') || 'fr';
function t(k){ return LANGS[currentLang][k] || LANGS.fr[k] || k; }

function renderLangRow(){
  document.getElementById('langRow').innerHTML = Object.keys(LANGS).map(l =>
    `<button class="lang-btn ${l===currentLang?'on':''}" onclick="setLang('${l}')">${LANGS[l].code}</button>`
  ).join('');
}
function setLang(l){
  currentLang = l;
  localStorage.setItem('wemeeat-admin-lang', l);
  renderLangRow();
  applyLang();
}
function applyLang(){
  document.documentElement.lang = currentLang;
  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.getElementById('gateLabel').textContent = t('gateLabel');
  document.getElementById('loginBtn').textContent = t('loginBtn');
  document.getElementById('refreshBtn').textContent = t('refresh');
  document.getElementById('statReservationsLbl').textContent = t('statReservations');
  document.getElementById('statPeopleLbl').textContent = t('statPeople');
  document.getElementById('statAmountLbl').textContent = t('statAmount');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  if(Object.keys(entriesById).length || document.getElementById('dashboard').style.display !== 'none'){
    render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
  }
}

async function loadBookings(){
  const key = document.getElementById('adminKeyInput').value.trim();
  if(!key){ document.getElementById('gateErr').textContent = t('errEmpty'); return; }
  currentKey = key;
  sessionStorage.setItem('wemeeat-admin-key', key);

  try{
    const res = await fetch(WORKER_URL + '?action=get_bookings_log', { headers: { 'X-Admin-Key': key } });
    const data = await res.json();
    if(data.error){
      document.getElementById('gateErr').textContent = t('errWrong');
      return;
    }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    render(data.entries || {});
  }catch(e){
    document.getElementById('gateErr').textContent = t('errConn');
  }
}

function render(rawEntries){
  entriesById = {};
  for(const id in rawEntries){
    try{ entriesById[id] = JSON.parse(rawEntries[id]); }catch(e){}
  }
  const allIds = Object.keys(entriesById);
  const totalPeopleAll = allIds.reduce((sum,id) => sum + (entriesById[id].partySize||0), 0);
  const totalPeopleUnbilled = allIds.filter(id => !entriesById[id].billed).reduce((sum,id) => sum + (entriesById[id].partySize||0), 0);
  document.getElementById('statCount').textContent = allIds.length;
  document.getElementById('statPeople').textContent = totalPeopleAll;
  document.getElementById('statAmount').textContent = (totalPeopleUnbilled * PRICE_PER_PERSON) + ' €';

  renderFiltered();
}

function renderFiltered(){
  const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  let ids = Object.keys(entriesById).sort((a,b) => (entriesById[b].confirmedAt||0) - (entriesById[a].confirmedAt||0));
  if(query){
    ids = ids.filter(id => {
      const e = entriesById[id];
      return (e.venue||'').toLowerCase().includes(query) ||
             (e.confirmedBy||'').toLowerCase().includes(query) ||
             (e.code||'').toLowerCase().includes(query);
    });
  }

  const wrap = document.getElementById('tableWrap');
  if(ids.length === 0){
    wrap.innerHTML = `<div class="empty">${query ? t('noSearchResults') : t('empty')}</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead><tr>
        <th>${t('thBilled')}</th><th>${t('thRestaurant')}</th><th>${t('thPeople')}</th><th>${t('thAmount')}</th>
        <th>${t('thDay')}</th><th>${t('thTime')}</th><th>${t('thConfirmed')}</th><th>${t('thBy')}</th><th>${t('thCode')}</th><th></th>
      </tr></thead>
      <tbody>
        ${ids.map(id => {
          const e = entriesById[id];
          return `
          <tr class="${e.billed ? 'billed' : ''}" id="row-${id}">
            <td><input type="checkbox" ${e.billed ? 'checked' : ''} onchange="toggleBilled('${id}', this.checked)"></td>
            <td class="venue">${escapeHtml(e.venue||'—')}</td>
            <td>
              <input type="number" min="0" value="${e.partySize ?? 0}" style="width:56px; padding:5px 7px; border-radius:8px; border:1px solid var(--line); font-family:'Karla',sans-serif; font-size:13px;" onchange="updatePartySize('${id}', this.value)">
              ${e.cancelledCount ? `<div style="font-size:10px; color:#C4472E; margin-top:3px;">${t('cancelledHint').replace('{n}', e.cancelledCount)}</div>` : ''}
            </td>
            <td class="amount">${(e.partySize||0) * PRICE_PER_PERSON} €</td>
            <td>${formatDateRaw(e.dateRaw)}</td>
            <td>${e.timeRaw||'—'}</td>
            <td>${e.confirmedAt ? new Date(e.confirmedAt).toLocaleString(LANGS[currentLang].locale) : '—'}</td>
            <td>${escapeHtml(e.confirmedBy||'—')}</td>
            <td style="font-family:'IBM Plex Mono',monospace; font-size:11px;">${escapeHtml(e.code||'—')}</td>
            <td><button class="del-btn" onclick="deleteBooking('${id}')">${t('deleteBtn')}</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

async function updatePartySize(id, newValue){
  const entry = entriesById[id];
  if(!entry) return;
  entry.partySize = parseInt(newValue) || 0;
  const url = WORKER_URL + '?action=update_booking&id=' + encodeURIComponent(id) + '&entry=' + encodeURIComponent(JSON.stringify(entry));
  await fetch(url, { headers: { 'X-Admin-Key': currentKey } }).catch(()=>{});
  render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
}

async function toggleBilled(id, checked){
  const entry = entriesById[id];
  if(!entry) return;
  entry.billed = checked;
  const url = WORKER_URL + '?action=update_booking&id=' + encodeURIComponent(id) + '&entry=' + encodeURIComponent(JSON.stringify(entry));
  await fetch(url, { headers: { 'X-Admin-Key': currentKey } }).catch(()=>{});
  render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
}

async function deleteBooking(id){
  if(!confirm(t('confirmDelete'))) return;
  const url = WORKER_URL + '?action=delete_booking&id=' + encodeURIComponent(id);
  await fetch(url, { headers: { 'X-Admin-Key': currentKey } }).catch(()=>{});
  delete entriesById[id];
  render(Object.fromEntries(Object.entries(entriesById).map(([k,v]) => [k, JSON.stringify(v)])));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDateRaw(dateRaw){
  if(!dateRaw) return '—';
  const [y, m, d] = dateRaw.split('-');
  return (d && m && y) ? `${d}/${m}/${y}` : dateRaw;
}

renderLangRow();
applyLang();

const savedKey = sessionStorage.getItem('wemeeat-admin-key');
if(savedKey){
  document.getElementById('adminKeyInput').value = savedKey;
  loadBookings();
}
</script>

</body>
</html>
